name: web-build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        working-directory: websrc
        run: |
          npm ci --legacy-peer-deps
          npm run build -- --outDir ../dist-pages --emptyOutDir
          npm run build -- --outDir ../dist-app --emptyOutDir
      - uses: actions/upload-artifact@v4
        with:
          name: ruefly-dist-pages
          path: dist-pages
