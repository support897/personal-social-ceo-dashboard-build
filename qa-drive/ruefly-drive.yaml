      - tapOn:
          point: "90%, 62%"
      - tapOn:
          text: "Continue with email"
          waitUntilVisible: true
          retryTapIfNoChange: true
      - waitForAnimationToEnd
# Inside proof: TWO entry shapes stand in the evidence. A
# FRESH account meets the tour CARD (the composed greeting
# node; drive 4). A RETURNING account whose name was never
# saved meets the name SHEET (drive 5's failure frame): its own
# heading node reads exactly "What's your name?", over the
# re-exposed home, with the "Your name" field and Save / Not
# now buttons that the tree does NOT carry as text nodes —
# Save is tapped by its measured point (74%, 60%). Settle on
# the account pill first (it stands in the tree in both
# shapes), then handle whichever shape stands: the sheet gets
# the spine's sentinel name, SAVED; the card is skipped by its
# own control. The home's proofs run after.
# Drive 7 (run 39961347652) killed the "Your account" settle:
# the sign-in landed on the Socials ROOM, whose tree carries no
# such pill, and while the name sheet stands the tree holds the
# SHEET ALONE anyway (modal occlusion — the home's pixels are
# not tree texts). The sheet is this leg's expected shape on
# every A-entry so far (drives 5 and 7), so the judge now waits
# for the sheet itself, behind a transition refresh. Named
# forward note: the day a drive SAVES A's name, this entry
# lands straight on the home and this judge must move to the
# home's marker — that drive's frame will say so plainly.
- waitForAnimationToEnd
- swipe:
    direction: UP
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "What's your name?"
    commands:
      - tapOn:
          text: "Your name"
          waitUntilVisible: true
          retryTapIfNoChange: true
      - waitForAnimationToEnd
      - inputText: "Sim Driver RF"
      - tapOn:
          point: "90%, 59%"
      - tapOn:
          point: "74%, 60%"
      - extendedWaitUntil:
          notVisible:
            text: "What's your name?"
          timeout: 30000
