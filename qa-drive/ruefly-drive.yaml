    when:
      visible: "Sign out"
    commands:
      - tapOn:
          text: "Sign out"
          waitUntilVisible: true
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "Sign out"
    commands:
      - tapOn:
          point: "8%, 11%"
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Sign out"
          commands:
            - tapOn:
                text: "Sign out"
                waitUntilVisible: true
            - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Sign out"
    commands:
      - tapOn:
          text: "Sign out"
          waitUntilVisible: true
