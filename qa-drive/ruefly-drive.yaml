# The save lands on the dialog itself ("Saved." stands in its tree,
# drive 10's step-045 hierarchy) and the dialog STAYS open — its
# close is the user's own Cancel tap. Prove the save, close the
# dialog, prove it gone; only then do the queue judges below read
# the queue itself and not the dialog's ghost (drive 10 died at the
# sign-out leg's sidebar tap with the dialog standing modal).
# Drive 13 (run 39986908374) killed this proof's FATAL form: the
# save landed (a SECOND draft card stands in the queue) and the
# dialog closed, all inside the 30 s window, and the transient
# "Saved." line had already vanished when the proof polled. The
# line is evidence when it lingers, never the judge — the durable
# save proof is the card standing on the planner, below.
- runFlow:
    when:
      visible: "Saved."
    commands:
      - takeScreenshot: 08b-saved-line
# Drive 11 (run 39977986782) proved the close is a RACE: the
# dialog closed on its own inside the "Saved." proof's window —
# the failure frame stands on the planner with the queue card
# already rendered — and the unconditional Cancel tap then had
# nothing to tap. The close is now conditional on the dialog
# still standing; the notVisible proof below judges either way.
# Drive 14 (run 39991154339) died at the notVisible proof
# below, step-048: the save landed ("Saved." stands in the
# failure hierarchy, the 08b evidence frame fired) and the
# dialog stayed open BY DESIGN — but the Cancel tap never
# reached it. The failure hierarchy measures why: "Cancel"
# stands at y 569-615, and the iOS KEYBOARD TUTORIAL card
# ("Speed up your typing...", its "Continue" at y 819-840)
# covers the screen's lower half, because the caption field
# still holds focus after the save. Both Cancel taps (the
# retry included) hit the tutorial card. Cure: dismiss the
# tutorial first, conditionally, by its own text — it stands
# only while a field holds first-use focus.
# DRIVE 20 (run 40013170934) died at the fold20 bonus
# judge, step-057 — and its failure hierarchy convicts
# THIS segment, three steps earlier: the dialog node in
# the tree reads "Your planned post, web dialog", so the
# old key "Plan a post, web dialog" matched NOTHING: the
# close runFlow never fired, its fatal notVisible judge
# passed vacuously, and the "Your planned post" judge
# below read the DIALOG's own heading (the ghost read).
# The whole sign-out segment then ran against the modal
# sheet. Cure (v21): the close keys on "Cancel" — a node
# that stands ONLY inside the dialog (bounds
# [39,792][198,838] in the death hierarchy) — a second
# attempt keys on the dialog's true tree name, and the
# fatal judge reads notVisible "Cancel": present iff
# the dialog stands, so it can never pass vacuously.
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - runFlow:
          when:
            visible: "Speed up your typing by sliding your finger across the letters to compose a word."
          commands:
            - tapOn:
                text: "Continue"
                waitUntilVisible: true
            - waitForAnimationToEnd
      - tapOn:
          text: "Cancel"
          waitUntilVisible: true
          retryTapIfNoChange: true
- runFlow:
    when:
      visible: "Your planned post, web dialog"
    commands:
      - tapOn:
          text: "Cancel"
          waitUntilVisible: true
- extendedWaitUntil:
    notVisible:
      text: "Cancel"
    timeout: 30000
# THE DURABLE SAVE PROOF: the queue card standing on the planner
