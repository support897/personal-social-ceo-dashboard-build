# ---------- cold open: the door ------------------------------------
# A cold signed-out arrival reads the door alone (the b18 planner
# leg's (b) read + the delete leg's final door text). The door
# heading is the cold proof.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Sign in or make your account"
    timeout: 90000
- takeScreenshot: 00-door
# ---------- stage (i): sign up, account 1 (email step, then --------
# ---------- password step; the door's roads are the b18/fold20 -----
# ---------- instruments' own: #fbEmailLogin -> #fbDoorForm, ---------
# ---------- #fbPasswordLogin -> #fbPwForm) ---------------------------
- tapOn:
    text: "you@example.com"
    waitUntilVisible: true
- inputText: "${TEST_EMAIL}"
- tapOn:
    point: "90%, 62%"  # WKWebView accessory Done (hideKeyboard class cure)
- takeScreenshot: 01-email-step
- tapOn:
    text: "Next"
    waitUntilVisible: true
- tapOn:
    text: "Your password"
    waitUntilVisible: true
- inputText: "${TEST_PASSWORD}"
- tapOn:
    point: "90%, 62%"  # WKWebView accessory Done (hideKeyboard class cure)
- takeScreenshot: 02-password-step
# TREE-LAG GUARD (drive 3): the WebView accessibility tree can
# stand EMPTY mid-transition while the pixels already show the
# step — wait for the button IN THE TREE before tapping it.
- waitForAnimationToEnd
- swipe:
    direction: UP
- extendedWaitUntil:
    visible:
      text: "Continue with email"
    timeout: 90000
- tapOn:
    text: "Continue with email"
    waitUntilVisible: true
    retryTapIfNoChange: true
# Drive 12 (run 39982962200): the COLD-CHANNEL LOAD FAILURE —
# the class NeedsMe drive 4 named and was never charged for —
# recurred on THIS door: the failure frame stands on the
# password step with the app's own line spoken, "Your account
# could not load. Try again.", the field cleared, the state
# clean and retryable. This leg carried no retry for the line;
# the staggered recovery below (NeedsMe v5's shape, with the
# retype — the field stands empty) now stands before the entry
# shapes, and the "Your Socials" judge behind them decides.
- runFlow:
    when:
      visible: "Your account could not load. Try again."
    commands:
      - tapOn:
          text: "Your password"
          waitUntilVisible: true
          retryTapIfNoChange: true
      - waitForAnimationToEnd
      - inputText: "${TEST_PASSWORD}"
      - tapOn:
          point: "90%, 62%"
      - tapOn:
          text: "Continue with email"
          waitUntilVisible: true
          retryTapIfNoChange: true
      - waitForAnimationToEnd
- runFlow:
