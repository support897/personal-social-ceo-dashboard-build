<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#FFF4E8" />
    <link rel="icon" type="image/svg+xml" href="/icons/mark.svg" />
    <title>Ruefly CEO</title>
    <style>
      @font-face { font-family: "Instrument Serif"; src: url("/fonts/InstrumentSerif-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Outfit"; src: url("/fonts/Outfit.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
      :root {
        --cream: #FFF4E8; --surface: #FFFBF4; --hairline: #EAD9C8;
        --coral: #FF5A48; --anchor: #C93327; --ink: #33161F;
        --marigold: #FFB43A; --muted: #755144; --tint: #FFC4B8;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--cream); color: var(--ink); font-family: "Outfit", system-ui, sans-serif; }
      h1, h2, h3 { font-family: "Instrument Serif", serif; font-weight: 400; }
      header.top { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--hairline); }
      header.top img { width: 34px; height: 34px; }
      header.top h1 { font-size: 24px; margin: 0; }
      header.top .who { margin-left: auto; font-size: 13px; color: var(--muted); }
      main { max-width: 1060px; margin: 0 auto; padding: 8px 20px 60px; }
      .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; padding: 16px 18px; margin: 12px 0; }
      .num { font-family: "Instrument Serif", serif; font-size: 34px; }
      .num .unit { font-size: 15px; color: var(--muted); font-family: "Outfit", sans-serif; }
      .lbl { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
      .layout { display: grid; grid-template-columns: 200px 1fr; gap: 16px; align-items: start; }
      @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
      nav.side { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
      nav.side button { text-align: left; border: 1px solid var(--hairline); background: var(--surface); border-radius: 10px; padding: 10px 12px; font: inherit; font-weight: 600; cursor: pointer; color: var(--ink); }
      nav.side button.on { background: var(--coral); color: var(--ink); border-color: var(--coral); }
      button.act { border: 0; background: var(--anchor); color: #fff; border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 700; cursor: pointer; }
      button.ghost { border: 1px solid var(--hairline); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; }
      input { width: 100%; border: 1px solid var(--hairline); border-radius: 10px; padding: 10px 12px; font: inherit; background: #fff; color: var(--ink); }
      label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: 14px; }
      table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
      th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--hairline); }
      th { color: var(--muted); font-weight: 600; font-size: 13px; }
      .hint { color: var(--muted); font-size: 14px; }
      .msg { color: var(--anchor); font-weight: 600; font-size: 14px; min-height: 1.2em; }
      .tag { display: inline-block; background: var(--marigold); color: var(--ink); border-radius: 999px; padding: 1px 9px; font-size: 12.5px; font-weight: 600; }
      .feed-item { padding: 9px 0; border-bottom: 1px solid var(--hairline); font-size: 14.5px; }
      .feed-item:last-child { border-bottom: 0; }
      .feed-item .when { color: var(--muted); font-size: 12.5px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header class="top">
      <img src="/icons/mark.svg" alt="" />
      <h1>Ruefly CEO</h1>
      <span class="who" id="whoLine"></span>
    </header>
    <main id="ownerRoot"></main>
    <script type="module" src="/src/owner.js"></script>
  </body>
</html>
